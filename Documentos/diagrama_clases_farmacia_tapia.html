<style>
#erd svg.classDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.classDiagram .row-rect-odd path,
#erd svg.classDiagram .row-rect-odd rect,
#erd svg.classDiagram .row-rect-even path,
#erd svg.classDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagram = `classDiagram
  class Farmacia {
    +String nombre
    +String direccion
    +String telefono
    +String horarioSemana
    +String horarioSabado
    +mostrarInfo()
  }
  class Categoria {
    +int id
    +String nombre
    +listarProductos()
  }
  class Producto {
    +int id
    +String nombre
    +String descripcion
    +float precio
    +int stock
    +actualizarStock()
  }
  class Cliente {
    +int id
    +String nombre
    +String telefono
    +String direccion
    +registrarse()
    +realizarPedido()
  }
  class Pedido {
    +int id
    +Date fecha
    +String estado
    +float total
    +calcularTotal()
    +confirmarPedido()
  }
  class DetallePedido {
    +int cantidad
    +float precioUnitario
    +calcularSubtotal()
  }
  Farmacia "1" --> "*" Producto : vende
  Categoria "1" --> "*" Producto : clasifica
  Cliente "1" --> "*" Pedido : realiza
  Pedido "1" --> "*" DetallePedido : contiene
  Producto "1" --> "*" DetallePedido : incluye`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.classDiagram .node rect, #erd svg.classDiagram g.classGroup rect').forEach(rect => {
  rect.setAttribute('rx', '8');
});
</script>
